<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Culturales - Plataforma Comunitaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css?v=6">
    <style>
        .event-card { border-left: 5px solid var(--primary-color); }
        .event-date-box {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            min-width: 80px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-eventos">
    <!-- Emojis Flotantes -->
    <div class="emoji-bg e1">📅</div>
    <div class="emoji-bg e2">🎉</div>
    <div class="emoji-bg e3">🎟️</div>
    <div class="emoji-bg e4">🎪</div>
    <div class="emoji-bg e5">🌟</div>
    <div class="emoji-bg e6">📣</div>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="fa-solid fa-people-group me-2" style="color: var(--primary-color);"></i>
                Plataforma Comunitaria
            </a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="emprendimientos.html">Emprendimientos</a></li>
                    <li class="nav-item"><a class="nav-link" href="portafolio.html?v=v4">Artistas</a></li>
                    <li class="nav-item"><a class="nav-link active" href="eventos.html">Eventos</a></li>
                    <li class="nav-item"><a class="nav-link" href="empleos.html">Empleos</a></li>
                    <li class="nav-item ms-lg-3" id="authNavArea">
                        <a href="login.html" class="btn btn-primary btn-sm mt-1">Iniciar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold page-title">Agenda de Eventos</h2>
            <button class="btn btn-primary auth-required" id="btnCrearEvento" data-bs-toggle="modal" data-bs-target="#crearModal" style="display: none;">
                <i class="fa-solid fa-calendar-plus me-1"></i> Publicar Evento
            </button>
        </div>

        <div class="row g-4" id="eventList">
            <div class="text-center text-muted w-100 py-5">Cargando eventos...</div>
        </div>
    </div>

    <!-- Modal Crear Evento -->
    <div class="modal fade" id="crearModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content glass-modal">
                <form id="crearForm">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold">Nuevo Evento</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Evento</label>
                            <input type="text" class="form-control" id="evName" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Fecha</label>
                                <input type="date" class="form-control" id="evDate" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Hora</label>
                                <input type="time" class="form-control" id="evTime" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ubicación</label>
                            <input type="text" class="form-control" id="evLocation" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo de Evento</label>
                            <select class="form-control" id="evType">
                                <option>Cultural</option>
                                <option>Deportivo</option>
                                <option>Social</option>
                                <option>Taller/Clase</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Imagen representativa</label>
                            <input type="file" class="form-control" id="evImage" accept="image/*">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" rows="3" id="evDesc" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-primary">Guardar Evento</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Editar Evento -->
    <div class="modal fade" id="editarModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content glass-modal">
                <form id="editarForm">
                    <input type="hidden" id="editId">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold">Editar Evento</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Evento</label>
                            <input type="text" class="form-control" id="editName" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Fecha</label>
                                <input type="date" class="form-control" id="editDate" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Hora</label>
                                <input type="time" class="form-control" id="editTime" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ubicación</label>
                            <input type="text" class="form-control" id="editLocation" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo de Evento</label>
                            <select class="form-control" id="editType">
                                <option>Cultural</option>
                                <option>Deportivo</option>
                                <option>Social</option>
                                <option>Taller/Clase</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Imagen representativa (Opcional)</label>
                            <input type="file" class="form-control" id="editImage" accept="image/*">
                            <small class="text-muted">Si no seleccionas nada, se mantendrá la imagen actual.</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" rows="3" id="editDesc" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-primary">Actualizar Evento</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js?v=v3"></script>
    <script>
        let allEvents = [];
        document.addEventListener('DOMContentLoaded', () => {
            loadEvents();
        });

        async function loadEvents() {
            try {
                const res = await fetchWithAuth('http://localhost:3001/api/events');
                allEvents = await res.json();
                
                const container = document.getElementById('eventList');
                container.innerHTML = '';
                
                if(allEvents.length === 0) {
                    container.innerHTML = '<div class="text-center w-100 text-muted">Aún no hay eventos programados.</div>';
                    return;
                }

                const user = JSON.parse(localStorage.getItem('user'));
                const currentUserId = user ? user.id : null;

                allEvents.forEach(e => {
                    const dateObj = new Date(e.event_date);
                    const months = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
                    const baseUrl = BASE_URL;
                    const imgSrc = e.image_url ? (e.image_url.startsWith('http') ? e.image_url : `${baseUrl}${e.image_url}`) : null;
                    const imgHtml = imgSrc ? `<img src="${imgSrc}" class="rounded me-3 shadow-sm" style="width: 120px; height: 120px; object-fit: cover;" alt="${e.name}">` : '';

                    const isOwner = currentUserId === e.user_id;
                    const editBtn = isOwner ? `<button class="btn btn-sm btn-outline-secondary mt-3 me-2" onclick="openEditModal(${e.id})"><i class="fa-solid fa-pen"></i> Editar</button>` : '';
                    const deleteBtn = isOwner ? `<button class="btn btn-sm btn-outline-danger mt-3" onclick="deleteEvent(${e.id})"><i class="fa-solid fa-trash"></i> Eliminar</button>` : '';

                    const card = `
                        <div class="col-12">
                            <div class="card event-card shadow-sm border-0 mb-3 glass-card">
                                <div class="card-body d-flex align-items-center">
                                    <div class="event-date-box me-4">
                                        <div class="fs-4 fw-bold text-primary">${dateObj.getDate()}</div>
                                        <div class="small text-uppercase fw-bold">${months[dateObj.getMonth()]}</div>
                                    </div>
                                    ${imgHtml}
                                    <div class="flex-grow-1">
                                        <h5 class="fw-bold mb-1">${e.name}</h5>
                                        <p class="text-muted small mb-2">
                                            <i class="fa-regular fa-clock me-1"></i> ${e.event_time} | 
                                            <i class="fa-solid fa-location-dot ms-2 me-1"></i> ${e.location}
                                        </p>
                                        <p class="mb-0">${e.description}</p>
                                        ${editBtn}
                                        ${deleteBtn}
                                    </div>
                                    <div class="ms-3">
                                        <span class="badge bg-secondary">${e.event_type}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (e) {
                console.error(e);
                document.getElementById('eventList').innerHTML = '<div class="text-danger w-100 text-center">Error al cargar eventos</div>';
            }
        }

        async function deleteEvent(id) {
            if (!confirm('¿Estás seguro de que deseas eliminar este evento?')) {
                return;
            }

            try {
                const res = await fetchWithAuth('http://localhost:3001/api/events/' + id, {
                    method: 'DELETE'
                });
                
                if (!res.ok) {
                    const d = await res.json();
                    throw new Error(d.error || 'Error al eliminar');
                }
                
                alert('Evento eliminado exitosamente');
                loadEvents();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        document.getElementById('crearForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('name', document.getElementById('evName').value);
            formData.append('event_date', document.getElementById('evDate').value);
            formData.append('event_time', document.getElementById('evTime').value);
            formData.append('location', document.getElementById('evLocation').value);
            formData.append('event_type', document.getElementById('evType').value);
            formData.append('description', document.getElementById('evDesc').value);

            const fileInput = document.getElementById('evImage');
            if (fileInput.files[0]) {
                formData.append('image', fileInput.files[0]);
            }

            try {
                const res = await fetchWithAuth('http://localhost:3001/api/events', {
                    method: 'POST',
                    body: formData
                });
                
                if (!res.ok) {
                    const d = await res.json();
                    throw new Error(d.error || 'No se pudo guardar el evento');
                }

                const modal = bootstrap.Modal.getInstance(document.getElementById('crearModal'));
                modal.hide();
                e.target.reset();
                loadEvents();
                
            } catch (err) {
                alert('Error al guardar: ' + err.message);
            }
        });

        function openEditModal(id) {
            const ev = allEvents.find(e => e.id === id);
            if (!ev) return;
            
            document.getElementById('editId').value = ev.id;
            document.getElementById('editName').value = ev.name;
            // Format date to YYYY-MM-DD
            const dateObj = new Date(ev.event_date);
            document.getElementById('editDate').value = dateObj.toISOString().split('T')[0];
            document.getElementById('editTime').value = ev.event_time;
            document.getElementById('editLocation').value = ev.location;
            document.getElementById('editType').value = ev.event_type;
            document.getElementById('editDesc').value = ev.description;
            
            const modal = new bootstrap.Modal(document.getElementById('editarModal'));
            modal.show();
        }

        document.getElementById('editarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            
            const formData = new FormData();
            formData.append('name', document.getElementById('editName').value);
            formData.append('event_date', document.getElementById('editDate').value);
            formData.append('event_time', document.getElementById('editTime').value);
            formData.append('location', document.getElementById('editLocation').value);
            formData.append('event_type', document.getElementById('editType').value);
            formData.append('description', document.getElementById('editDesc').value);

            const fileInput = document.getElementById('editImage');
            if (fileInput.files[0]) {
                formData.append('image', fileInput.files[0]);
            }

            try {
                const res = await fetchWithAuth('http://localhost:3001/api/events/' + id, {
                    method: 'PUT',
                    body: formData
                });
                
                if (!res.ok) {
                    const d = await res.json();
                    throw new Error(d.error || 'No se pudo actualizar el evento');
                }

                bootstrap.Modal.getInstance(document.getElementById('editarModal')).hide();
                loadEvents();
                alert('Evento actualizado con éxito');
            } catch (err) {
                alert('Error al actualizar: ' + err.message);
            }
        });
    </script>
</body>
</html>
