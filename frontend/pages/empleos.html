<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleo y Empresas - Plataforma Comunitaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="fa-solid fa-people-group me-2" style="color: var(--primary-color);"></i>
                Plataforma Comunitaria
            </a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="emprendimientos.html">Emprendimientos</a></li>
                    <li class="nav-item"><a class="nav-link" href="portafolio.html">Artistas</a></li>
                    <li class="nav-item"><a class="nav-link" href="eventos.html">Eventos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="empleos.html">Empleos</a></li>
                    <li class="nav-item ms-lg-3" id="authNavArea">
                        <a href="login.html" class="btn btn-primary btn-sm mt-1">Iniciar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Bolsa de Empleo</h2>
            <button class="btn btn-primary" id="btnCrearEmpleo" data-bs-toggle="modal" data-bs-target="#crearModal" style="display: none;">
                <i class="fa-solid fa-plus me-1"></i> Publicar Vacante
            </button>
        </div>

        <div class="row g-4" id="jobList">
            <div class="text-center text-muted w-100 py-5">Cargando vacantes...</div>
        </div>
    </div>

    <!-- Modal Crear Vacante -->
    <div class="modal fade" id="crearModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="crearForm">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold">Publicar Nueva Vacante</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Título del Cargo</label>
                            <input type="text" class="form-control" id="jobTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" rows="3" id="jobDesc" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Requisitos</label>
                            <textarea class="form-control" rows="3" id="jobReq"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-primary">Publicar Vacante</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Aplicar -->
    <div class="modal fade" id="aplicarModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="aplicarForm">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold">Aplicar a Vacante</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="applyJobId">
                        <div class="mb-3">
                            <label class="form-label">Adjuntar Hoja de Vida (PDF)</label>
                            <input type="file" class="form-control" id="applyCv" accept="application/pdf" required>
                            <small class="text-muted">Solo formato PDF, máx 5MB.</small>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-success">Enviar Aplicación</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Editar Vacante -->
    <div class="modal fade" id="editarModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="editarForm">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold">Editar Vacante</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editJobId">
                        <div class="mb-3">
                            <label class="form-label">Título del Cargo</label>
                            <input type="text" class="form-control" id="editJobTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" rows="3" id="editJobDesc" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Requisitos</label>
                            <textarea class="form-control" rows="3" id="editJobReq"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Ver Aplicaciones -->
    <div class="modal fade" id="verAplicacionesModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Hojas de Vida Recibidas</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="aplicacionesList" class="row g-3">
                        <div class="text-center text-muted w-100">Cargando hojas de vida...</div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadJobs();
        });

        let allJobs = []; // Guardar vacantes en memoria para editar

        async function loadJobs() {
            try {
                const res = await fetchWithAuth(API_URL + '/jobs');
                allJobs = await res.json();
                
                const container = document.getElementById('jobList');
                container.innerHTML = '';
                
                const user = JSON.parse(localStorage.getItem('user'));
                const currentUserId = user ? user.id : null;

                // Controlar visibilidad del botón de crear vacante
                if (user && (user.role === 'admin' || user.role === 'empresa')) {
                    document.getElementById('btnCrearEmpleo').style.display = 'block';
                }

                if(allJobs.length === 0) {
                    container.innerHTML = '<div class="text-center w-100 text-muted">Aún no hay vacantes disponibles.</div>';
                    return;
                }

                allJobs.forEach(j => {
                    const isOwner = currentUserId === j.company_id;
                    const editBtn = isOwner ? `<button class="btn btn-outline-warning btn-sm me-2" onclick="openEditModal(${j.id})"><i class="fa-solid fa-pen"></i> Editar</button>` : '';
                    const deleteBtn = isOwner ? `<button class="btn btn-outline-danger btn-sm me-2" onclick="deleteJob(${j.id})"><i class="fa-solid fa-trash"></i> Eliminar</button>` : '';
                    const verBtn = isOwner ? `<button class="btn btn-outline-info btn-sm me-2" onclick="verAplicaciones(${j.id})"><i class="fa-solid fa-users"></i> Hojas de Vida</button>` : '';

                    const isUser = user && (user.role === 'usuario' || user.role === 'artista');
                    const applyBtn = isUser ? `
                                    <button class="btn btn-outline-primary btn-sm" onclick="openApplyModal(${j.id})">
                                        Aplicar ahora
                                    </button>` : '';

                    const card = `
                        <div class="col-md-6">
                            <div class="card h-100 shadow-sm border-0">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h5 class="card-title fw-bold mb-0 text-primary">${j.title}</h5>
                                        <span class="badge bg-light text-dark border">${j.company_name}</span>
                                    </div>
                                    <p class="card-text text-muted mb-2">${j.description}</p>
                                    <p class="card-text small"><strong>Requisitos:</strong> ${j.requirements || 'No especificados'}</p>
                                </div>
                                <div class="card-footer bg-white border-top-0 d-flex justify-content-end gap-2">
                                    ${verBtn}
                                    ${editBtn}
                                    ${deleteBtn}
                                    ${applyBtn}
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (e) {
                console.error(e);
                document.getElementById('jobList').innerHTML = '<div class="text-danger w-100 text-center">Error al cargar empleos</div>';
            }
        }

        function openApplyModal(id) {
            document.getElementById('applyJobId').value = id;
            new bootstrap.Modal(document.getElementById('aplicarModal')).show();
        }

        function openEditModal(id) {
            const job = allJobs.find(j => j.id === id);
            if(job) {
                document.getElementById('editJobId').value = job.id;
                document.getElementById('editJobTitle').value = job.title;
                document.getElementById('editJobDesc').value = job.description;
                document.getElementById('editJobReq').value = job.requirements || '';
                new bootstrap.Modal(document.getElementById('editarModal')).show();
            }
        }

        async function verAplicaciones(jobId) {
            new bootstrap.Modal(document.getElementById('verAplicacionesModal')).show();
            const container = document.getElementById('aplicacionesList');
            container.innerHTML = '<div class="text-center text-muted w-100">Cargando hojas de vida...</div>';

            try {
                const res = await fetchWithAuth(API_URL + '/jobs/' + jobId + '/applications');
                const apps = await res.json();

                if (!res.ok) throw new Error(apps.error || 'Error al cargar aplicaciones');

                if (apps.length === 0) {
                    container.innerHTML = '<div class="text-center text-muted w-100 py-3">Aún no hay aplicaciones para esta vacante.</div>';
                    return;
                }

                const baseUrl = 'http://localhost:3000';
                container.innerHTML = apps.map(app => {
                    const date = new Date(app.application_date).toLocaleDateString();
                    return `
                        <div class="col-12">
                            <div class="card shadow-sm border-0">
                                <div class="card-body d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="fw-bold mb-1"><i class="fa-solid fa-user-circle me-2 text-primary"></i>${app.applicant_name}</h6>
                                        <div class="text-muted small"><i class="fa-solid fa-envelope me-1"></i>${app.applicant_email} &bull; <i class="fa-regular fa-calendar me-1"></i>${date}</div>
                                    </div>
                                    <a href="${baseUrl}${app.cv_url}" target="_blank" class="btn btn-sm btn-primary">
                                        <i class="fa-solid fa-file-pdf me-1"></i> Ver PDF
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                container.innerHTML = '<div class="text-center text-danger w-100">' + error.message + '</div>';
            }
        }

        async function deleteJob(id) {
            if (!confirm('¿Estás seguro de que deseas eliminar esta vacante?')) {
                return;
            }

            try {
                const res = await fetchWithAuth(API_URL + '/jobs/' + id, {
                    method: 'DELETE'
                });
                
                if (!res.ok) {
                    const d = await res.json();
                    throw new Error(d.error || 'Error al eliminar');
                }
                
                alert('Vacante eliminada exitosamente');
                loadJobs();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        document.getElementById('crearForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                title: document.getElementById('jobTitle').value,
                description: document.getElementById('jobDesc').value,
                requirements: document.getElementById('jobReq').value,
            };

            try {
                const res = await fetchWithAuth(API_URL + '/jobs', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const d = await res.json();
                    throw new Error(d.error || 'No se pudo publicar la vacante');
                }

                bootstrap.Modal.getInstance(document.getElementById('crearModal')).hide();
                e.target.reset();
                loadJobs();
            } catch (err) {
                alert('Error al guardar: ' + err.message);
            }
        });

        document.getElementById('editarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editJobId').value;
            const payload = {
                title: document.getElementById('editJobTitle').value,
                description: document.getElementById('editJobDesc').value,
                requirements: document.getElementById('editJobReq').value,
            };

            try {
                const res = await fetchWithAuth(API_URL + '/jobs/' + id, {
                    method: 'PUT',
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const d = await res.json();
                    throw new Error(d.error || 'No se pudo editar la vacante');
                }

                bootstrap.Modal.getInstance(document.getElementById('editarModal')).hide();
                loadJobs();
            } catch (err) {
                alert('Error al editar: ' + err.message);
            }
        });

        document.getElementById('aplicarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fileInput = document.getElementById('applyCv');
            const file = fileInput.files[0];
            
            // Validación estricta de PDF
            if (!file) {
                alert('Por favor selecciona un archivo.');
                return;
            }
            if (file.type !== 'application/pdf') {
                alert('¡Atención! Solo se permiten archivos en formato PDF. Por favor, convierte tu archivo a PDF e inténtalo de nuevo.');
                return;
            }

            const formData = new FormData();
            formData.append('job_id', document.getElementById('applyJobId').value);
            formData.append('cv', file);

            try {
                const res = await fetchWithAuth(API_URL + '/jobs/apply', {
                    method: 'POST',
                    body: formData
                });
                
                if (!res.ok) {
                    const d = await res.json();
                    throw new Error(d.error || 'No se pudo enviar la aplicación');
                }

                bootstrap.Modal.getInstance(document.getElementById('aplicarModal')).hide();
                e.target.reset();
                alert('¡Tu hoja de vida ha sido enviada con éxito!');
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });
    </script>
</body>
</html>
