<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Artístico - Plataforma Comunitaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css?v=6">
    <style>
        .gallery-item { cursor: pointer; transition: 0.3s; }
        .gallery-item:hover { opacity: 0.8; }
    </style>
</head>
<body class="bg-gradient-artistas">
    <!-- Emojis Flotantes -->
    <div class="emoji-bg e1">🎨</div>
    <div class="emoji-bg e2">✨</div>
    <div class="emoji-bg e3">🎭</div>
    <div class="emoji-bg e4">🎵</div>
    <div class="emoji-bg e5">🖌️</div>
    <div class="emoji-bg e6">📸</div>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="fa-solid fa-people-group me-2" style="color: var(--primary-color);"></i>
                Plataforma Comunitaria
            </a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="emprendimientos.html?v=v4">Emprendimientos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="portafolio.html?v=v4">Artistas</a></li>
                    <li class="nav-item"><a class="nav-link" href="eventos.html?v=v4">Eventos</a></li>
                    <li class="nav-item"><a class="nav-link" href="empleos.html?v=v4">Empleos</a></li>
                    <li class="nav-item ms-lg-3" id="authNavArea">
                        <a href="login.html" class="btn btn-primary btn-sm mt-1">Iniciar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold page-title">Portafolios Artísticos</h2>
            <button class="btn btn-primary auth-required" id="btnGestionarPortafolio" data-bs-toggle="modal" data-bs-target="#gestionarPortafolioModal" style="display: none;">
                <i class="fa-solid fa-paintbrush me-1"></i> Publicar Artista
            </button>
        </div>

        <div class="row g-4" id="artistList">
            <div class="text-center text-muted w-100 py-5">Cargando portafolios...</div>
        </div>
    </div>

    <!-- Modal Detalle Artista -->
    <div class="modal fade" id="artistaModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content glass-modal">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="artistaName">Nombre del Artista</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pt-0">
                    <p class="text-muted" id="artistaBio"></p>
                    <p><strong>Contacto:</strong> <span id="artistaContact"></span></p>
                    <hr>
                    <h5 class="fw-bold mb-3">Galería de Obras</h5>
                    <div class="row g-2" id="galleryList">
                        <!-- Obras dinámicas -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Gestionar Portafolio -->
    <div class="modal fade" id="gestionarPortafolioModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content glass-modal">
                <form id="gestionarForm">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold">Publicar Artista</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Artista</label>
                            <input type="text" class="form-control" id="portName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Foto del Artista / Perfil</label>
                            <input type="file" class="form-control" id="portImage" accept="image/*" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Biografía</label>
                            <textarea class="form-control" id="portBio" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Información de Contacto</label>
                            <textarea class="form-control" id="portContact" rows="2" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="submit" class="btn btn-primary w-100">Publicar Artista</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Subir Obra -->
    <div class="modal fade" id="subirObraModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content glass-modal">
                <form id="subirObraForm">
                    <div class="modal-header border-0">
                        <h5 class="modal-title fw-bold">Subir Nueva Obra</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Título de la Obra</label>
                            <input type="text" class="form-control" id="obraTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" id="obraDesc" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo de Archivo</label>
                            <select class="form-control" id="obraType">
                                <option value="image">Imagen (Foto, Ilustración)</option>
                                <option value="video">Video</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Archivo Multimedia</label>
                            <input type="file" class="form-control" id="obraMedia" required accept="image/*,video/*">
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#gestionarPortafolioModal">Atrás</button>
                        <button type="submit" class="btn btn-primary">Subir Obra</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js?v=v3"></script>
    <script>
        let currentPortfolioId = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadPortfolios();
        });

        async function loadPortfolios() {
            try {
                const res = await fetchWithAuth('http://localhost:3001/api/portfolios');
                const p = await res.json();
                
                const container = document.getElementById('artistList');
                container.innerHTML = '';
                
                if(p.length === 0) {
                    container.innerHTML = '<div class="text-center w-100 text-muted">Aún no hay artistas registrados</div>';
                    return;
                }

                const user = JSON.parse(localStorage.getItem('user'));
                const currentUserId = user ? user.id : null;

                p.forEach(artist => {
                    const isOwner = currentUserId === artist.user_id;
                    const deleteBtn = isOwner ? `<button class="btn btn-outline-danger btn-sm mt-2 w-100" onclick="event.stopPropagation(); deletePortfolio(${artist.id});">Eliminar Portafolio</button>` : '';
                    const addWorkBtn = isOwner ? `<button class="btn btn-outline-success btn-sm mt-2 w-100" onclick="event.stopPropagation(); openSubirObra(${artist.id});">Subir Obra</button>` : '';

                    let imageHtml = '';
                    if (artist.profile_image_url) {
                        const src = artist.profile_image_url.startsWith('http') ? artist.profile_image_url : `${BASE_URL}${artist.profile_image_url}`;
                        imageHtml = `<img src="${src}" class="rounded-circle shadow-sm mx-auto d-block" style="width: 80px; height: 80px; object-fit: cover; margin-bottom: 1rem;">`;
                    } else {
                        imageHtml = `<div class="bg-secondary text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3 shadow-sm" style="width: 80px; height: 80px; font-size: 2rem;">
                            ${artist.artist_name.charAt(0).toUpperCase()}
                        </div>`;
                    }

                    const card = `
                        <div class="col-md-3">
                            <div class="card h-100 shadow-sm border-0 text-center py-4 px-2 gallery-item glass-card" onclick="viewArtist(${artist.id})">
                                ${imageHtml}
                                <h5 class="card-title fw-bold">${artist.artist_name}</h5>
                                <p class="card-text text-muted small">${artist.bio ? artist.bio.substring(0, 60)+'...' : 'Artista local'}</p>
                                <div class="mt-auto">
                                    <button class="btn btn-outline-primary btn-sm w-100">Ver Portafolio</button>
                                    ${addWorkBtn}
                                    ${deleteBtn}
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (e) {
                console.error(e);
                document.getElementById('artistList').innerHTML = '<div class="text-danger w-100 text-center">Error al cargar portafolios</div>';
            }
        }

        async function viewArtist(id) {
            try {
                const res = await fetchWithAuth('http://localhost:3001/api/portfolios/' + id);
                const data = await res.json();

                document.getElementById('artistaName').innerText = data.portfolio.artist_name;
                document.getElementById('artistaBio').innerText = data.portfolio.bio || 'Sin biografía';
                document.getElementById('artistaContact').innerText = data.portfolio.contact_info || data.portfolio.artist_email;
                
                const gList = document.getElementById('galleryList');
                gList.innerHTML = '';
                
                if(data.items.length === 0) {
                    gList.innerHTML = '<p class="text-muted w-100">Este artista aún no ha subido obras.</p>';
                } else {
                    data.items.forEach(item => {
                        let mediaHtml = '';
                        if (item.type === 'video') {
                            const src = item.media_url.startsWith('http') ? item.media_url : `${BASE_URL}${item.media_url}`;
                            mediaHtml = `<video src="${src}" class="img-fluid rounded shadow-sm" style="height: 250px; width: 100%; object-fit: cover;" controls></video>`;
                        } else {
                            const src = item.media_url.startsWith('http') ? item.media_url : `${BASE_URL}${item.media_url}`;
                            mediaHtml = `<img src="${src}" class="img-fluid rounded shadow-sm" alt="${item.title}" style="height: 250px; width: 100%; object-fit: cover;">`;
                        }
                        
                        gList.innerHTML += `
                            <div class="col-md-4">
                            <div class="card h-100 shadow-sm border-0 glass-card">
                                ${mediaHtml}
                                    <div class="mt-2 text-center pb-2">
                                        <strong>${item.title || 'Obra'}</strong>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
                
                const modal = new bootstrap.Modal(document.getElementById('artistaModal'));
                modal.show();
            } catch(e) {
                alert('No se pudo cargar el portafolio.');
            }
        }

        async function deletePortfolio(id) {
            if (!confirm('¿Estás seguro de que deseas eliminar tu portafolio? Esta acción no se puede deshacer y borrará todas tus obras.')) {
                return;
            }

            try {
                const res = await fetchWithAuth('http://localhost:3001/api/portfolios/' + id, {
                    method: 'DELETE'
                });
                
                if (!res.ok) {
                    const d = await res.json();
                    throw new Error(d.error || 'Error al eliminar');
                }
                
                alert('Portafolio eliminado exitosamente');
                loadPortfolios();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        document.getElementById('gestionarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('artist_name', document.getElementById('portName').value);
            formData.append('bio', document.getElementById('portBio').value);
            formData.append('contact_info', document.getElementById('portContact').value);
            
            const fileInput = document.getElementById('portImage');
            if (fileInput.files[0]) {
                formData.append('profile_image', fileInput.files[0]);
            }

            try {
                const res = await fetchWithAuth('http://localhost:3001/api/portfolios', {
                    method: 'POST',
                    body: formData
                });
                if (!res.ok) {
                    const d = await res.json();
                    throw new Error(d.error || 'No se pudo guardar la información');
                }
                alert('¡Artista publicado con éxito!');
                bootstrap.Modal.getInstance(document.getElementById('gestionarPortafolioModal')).hide();
                document.getElementById('gestionarForm').reset();
                loadPortfolios();
            } catch (err) {
                alert('Error al guardar: ' + err.message);
            }
        });

        function openSubirObra(id) {
            currentPortfolioId = id;
            new bootstrap.Modal(document.getElementById('subirObraModal')).show();
        }

        document.getElementById('subirObraForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentPortfolioId) return alert('No se ha seleccionado un portafolio válido.');

            const formData = new FormData();
            formData.append('portfolio_id', currentPortfolioId);
            formData.append('title', document.getElementById('obraTitle').value);
            formData.append('description', document.getElementById('obraDesc').value);
            formData.append('type', document.getElementById('obraType').value);
            formData.append('media', document.getElementById('obraMedia').files[0]);

            try {
                const res = await fetchWithAuth('http://localhost:3001/api/portfolios/items', {
                    method: 'POST',
                    body: formData
                });
                if (!res.ok) {
                    const d = await res.json();
                    throw new Error(d.error || 'No se pudo subir la obra');
                }
                
                alert('Obra subida exitosamente!');
                document.getElementById('subirObraForm').reset();
                bootstrap.Modal.getInstance(document.getElementById('subirObraModal')).hide();
                loadPortfolios();
            } catch (err) {
                alert('Error al subir: ' + err.message);
            }
        });
    </script>
</body>
</html>
