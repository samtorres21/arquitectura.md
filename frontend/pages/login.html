<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceder - Plataforma Comunitaria</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--secondary-color), #000000);
            padding: 20px;
        }
        .auth-card {
            background: #fff;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="text-center mb-4">
                <a href="../index.html" class="text-decoration-none">
                    <h4 class="fw-bold" style="color: var(--secondary-color);">Plataforma Comunitaria</h4>
                </a>
            </div>

            <!-- Tabs -->
            <ul class="nav nav-pills mb-3 justify-content-center" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button">Ingresar</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button">Registrarse</button>
                </li>
            </ul>

            <div class="tab-content" id="pills-tabContent">
                <!-- Login Form -->
                <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
                    <form id="loginForm">
                        <div id="loginAlert" class="alert alert-danger d-none"></div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-2">Iniciar Sesión</button>
                    </form>
                </div>

                <!-- Register Form -->
                <div class="tab-pane fade" id="pills-register" role="tabpanel">
                    <form id="registerForm">
                        <div id="registerAlert" class="alert alert-danger d-none"></div>
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="regName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="regEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="regPassword" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label d-block text-center fw-bold mb-3">¿Qué tipo de cuenta deseas crear?</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="regRole" id="roleUser" value="usuario" checked>
                                    <label class="btn btn-outline-primary w-100 h-100 d-flex flex-column justify-content-center" for="roleUser">
                                        <i class="fa-solid fa-user mb-1"></i>
                                        <span>Usuario</span>
                                        <small style="font-size: 0.7em;">Busco Empleo</small>
                                    </label>
                                </div>
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="regRole" id="roleAdmin" value="admin">
                                    <label class="btn btn-outline-primary w-100 h-100 d-flex flex-column justify-content-center" for="roleAdmin">
                                        <i class="fa-solid fa-building mb-1"></i>
                                        <span>Administrador</span>
                                        <small style="font-size: 0.7em;">Ofrezco Empleo</small>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-2">Crear Cuenta</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js?v=v3"></script>
    <script>
        // Funcionalidad de login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const alertBox = document.getElementById('loginAlert');

            try {
                const res = await fetchWithAuth(API_URL + '/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Error de inicio de sesión');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '../index.html';
            } catch (err) {
                alertBox.textContent = err.message;
                alertBox.classList.remove('d-none');
            }
        });

        // Funcionalidad de registro
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const role_name = document.querySelector('input[name="regRole"]:checked').value;
            const alertBox = document.getElementById('registerAlert');

            try {
                const res = await fetchWithAuth(API_URL + '/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ name, email, password, role_name })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Error en el registro');

                // Si se registra, podemos loguearlo directamente o pedirle que inicie sesión
                alert('Registro exitoso. Por favor inicia sesión.');
                
                // Mover a la pestaña de login
                var loginTab = new bootstrap.Tab(document.getElementById('pills-login-tab'));
                loginTab.show();
                
            } catch (err) {
                alertBox.textContent = err.message;
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
